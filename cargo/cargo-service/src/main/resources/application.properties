spring.application.name=cargo-service
server.port=8081
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
spring.datasource.url=jdbc:postgresql://localhost:5443/cargo
spring.datasource.username=user
spring.datasource.password=password
spring.rabbitmq.host=localhost
spring.rabbitmq.username=user
spring.rabbitmq.password=password
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=4
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
flight.api.url=http://localhost:8080
spring.security.oauth2.client.registration.flight.client-id=cargo-service
spring.security.oauth2.client.registration.flight.client-secret=${CARGO_SERVICE_CLIENT_SECRET}
spring.security.oauth2.client.registration.flight.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.flight.token-uri=http://localhost:8180/realms/air-freight/protocol/openid-connect/token
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/air-freight
spring.security.oauth2.resourceserver.jwt.audiences=cargo-service
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/air-freight/protocol/openid-connect/certs
# loading window opens this long before std and closes this long before etd
cargo.loading-window.opens-before-std=12h
cargo.loading-window.closes-before-etd=20m
