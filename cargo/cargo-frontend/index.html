<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flights to load - Cargo Loading</title>
    <link rel="icon" type="image/svg+xml" href="/src/images/favicon.svg">
    <link rel="stylesheet" href="/src/css/app.css">
    <script type="module" src="/src/ts/flights-to-load.ts"></script>
</head>
<body class="bg-slate-50 text-slate-800">
<header class="bg-blue-950 text-white">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-3 gap-y-2 px-6 py-3">
        <img class="h-9 w-9" src="/src/images/logo-mark.svg" alt="Air Freight Operations">
        <h1 class="text-xl font-semibold">Flights to load</h1>
        <span class="ml-auto inline-flex items-center gap-2 text-sm text-white/80 max-sm:hidden"><i class="fa-solid fa-circle-user" aria-hidden="true"></i><span id="user-name"></span></span>
        <button id="sign-out" class="inline-flex cursor-pointer items-center gap-2 rounded border border-white/60 px-3 py-1 text-sm hover:bg-white/10 max-sm:ml-auto" type="button" hidden><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>Sign out</button>
    </div>
</header>
<main class="mx-auto max-w-6xl px-6 py-5">
    <div class="mb-4 flex flex-wrap items-center justify-between gap-x-6 gap-y-1 text-sm text-slate-600">
        <p>Date: scheduled departure date (UTC). Times: Brussels time (Europe/Brussels).</p>
    </div>
    <div id="error" class="error mb-4" role="alert" hidden></div>

    <section id="content" hidden>
        <div class="mb-4 flex flex-wrap items-center gap-6">
            <label>Scheduled departure date (UTC) <input id="date" class="rounded border border-slate-400 bg-white px-2 py-1" type="date" required></label>
            <label><input id="include-departed" type="checkbox"> Show departed flights</label>
        </div>
        <table class="w-full bg-white">
            <thead>
            <tr class="bg-slate-200 *:border-b *:border-slate-300 *:px-3 *:py-2 *:text-left">
                <th>Flight</th>
                <th>Scheduled departure date (UTC)</th>
                <th>From</th>
                <th>Departure (Brussels)</th>
                <th>To</th>
                <th>Arrival (Brussels)</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody id="flights"></tbody>
        </table>
        <p id="table-status" class="mt-3" role="status"></p>
    </section>
</main>
</body>
</html>
