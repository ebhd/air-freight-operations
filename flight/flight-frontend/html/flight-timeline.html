<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flight timeline - Flight Operations</title>
    <link rel="icon" type="image/svg+xml" href="/src/images/favicon.svg">
    <link rel="stylesheet" href="/src/css/app.css">
    <script type="module" src="/src/ts/presenter/flightTimelinePresenter.ts"></script>
</head>
<body class="bg-slate-50 text-slate-800">
<header class="bg-blue-950 text-white">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-x-3 gap-y-2 px-6 py-3">
        <img class="h-9 w-9" src="/src/images/logo-mark.svg" alt="Air Freight Operations">
        <h1 class="text-xl font-semibold">Flight timeline</h1>
        <span class="ml-auto inline-flex items-center gap-2 text-sm text-white/80 max-sm:hidden"><i class="fa-solid fa-circle-user" aria-hidden="true"></i><span id="user-name"></span></span>
        <button id="sign-out" class="inline-flex cursor-pointer items-center gap-2 rounded border border-white/60 px-3 py-1 text-sm hover:bg-white/10 max-sm:ml-auto" type="button" hidden><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>Sign out</button>
    </div>
</header>
<nav class="border-b border-slate-200 bg-white" aria-label="Flight pages">
    <div class="mx-auto flex max-w-7xl gap-2 px-6">
        <a class="tab" href="../index.html"><i class="fa-solid fa-table-list" aria-hidden="true"></i>Flights</a>
        <a class="tab tab-active" aria-current="page" href="flight-timeline.html"><i class="fa-solid fa-chart-gantt" aria-hidden="true"></i>Timeline</a>
    </div>
</nav>
<main class="mx-auto max-w-7xl px-6 py-5">
    <div class="mb-4 flex flex-wrap items-center justify-between gap-x-6 gap-y-1 text-sm text-slate-600">
        <p>Local day and times: Europe/Brussels.</p>
    </div>
    <div id="error" class="error mb-4" role="alert" hidden></div>
    <section id="content" aria-label="Daily flight timeline" hidden>
        <div class="mb-5 flex flex-wrap items-end justify-between gap-4">
            <div>
                <label class="block text-sm font-medium" for="date">Day in Brussels</label>
                <div class="mt-2 flex items-center gap-3">
                    <input id="date" class="field" type="date" required>
                    <button id="refresh" class="button" type="button"><i class="fa-solid fa-arrows-rotate mr-1" aria-hidden="true"></i>Refresh</button>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-5 text-sm" aria-label="Bar legend">
                <span class="flex items-center gap-2"><span class="timeline-swatch timeline-scheduled"></span>Scheduled</span>
                <span class="flex items-center gap-2"><span class="timeline-swatch timeline-extension"></span>Delay extension</span>
                <span class="flex items-center gap-2"><span class="timeline-arrow-swatch" aria-hidden="true">←</span>From previous day</span>
                <span class="flex items-center gap-2"><span class="timeline-arrow-swatch" aria-hidden="true">→</span>Continues next day</span>
            </div>
        </div>
        <p id="timeline-status" class="mb-3 text-sm text-slate-600" role="status"></p>
        <div class="overflow-x-auto rounded border border-slate-200 bg-white" tabindex="0" aria-label="Scroll the flight timeline horizontally">
            <div id="timeline" class="timeline-chart"></div>
        </div>
    </section>
</main>
</body>
</html>
