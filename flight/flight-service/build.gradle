plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

java { toolchain { languageVersion = JavaLanguageVersion.of(22) } }

dependencies {
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    runtimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'com.h2database:h2'

    // database tests against a real postgresql in docker, versions from the spring boot bom
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}

tasks.named('processResources') {
    dependsOn('installWebApp')
}

def webAppDir = 'src/main/resources/static'

tasks.register('installWebApp', Copy) {
    group = 'build'
    description = 'Installs the frontend bundle in resources/static'
    dependsOn(':flight:flight-frontend:build')
    from('../flight-frontend/dist')
    into(webAppDir)
}

tasks.register('cleanWebApp', Delete) {
    group = 'build'
    description = 'Cleans the frontend bundle from resources/static'
    delete(webAppDir)
}

tasks.named('clean') {
    dependsOn('cleanWebApp')
}

apply from: rootProject.file('gradle/quality.gradle')
