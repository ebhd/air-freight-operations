spring.datasource.url=jdbc:h2:mem:flight-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.dynamic=false
# spring restarts a paused test context and that starts the listeners, so point them
# at a closed port and never at a running dev rabbitmq where they would take messages
spring.rabbitmq.port=1
