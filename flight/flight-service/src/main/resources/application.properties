# app and api
spring.application.name=flight-service
server.port=8080
spring.mvc.problemdetails.enabled=true

# reject decimal minutes
spring.jackson.deserialization.accept-float-as-int=false

# health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# postgres connection
spring.datasource.url=jdbc:postgresql://localhost:5443/flight
spring.datasource.username=user
spring.datasource.password=password

# run our SQL scripts, then check the tables
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate

# don't keep JPA open for the whole web request
spring.jpa.open-in-view=false

# rabbitmq connection
spring.rabbitmq.host=localhost
spring.rabbitmq.username=user
spring.rabbitmq.password=password
spring.rabbitmq.connection-timeout=5s

# confirm outgoing messages and catch missing routes
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# retry incoming messages before recovery
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2

# keycloak token checks
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/air-freight
spring.security.oauth2.resourceserver.jwt.audiences=flight-service
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/air-freight/protocol/openid-connect/certs
