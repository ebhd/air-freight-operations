name: air-freight-operations

services:
  flight-service:
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--timeout=4", "--output-document=/dev/null", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
    build:
      context: .
      dockerfile: flight-service/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://app-postgres:5432/flight
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/air-freight
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/air-freight/protocol/openid-connect/certs
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_RABBITMQ_HOST: app-rabbitmq
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
    depends_on:
      keycloak:
        condition: service_healthy
      app-postgres:
        condition: service_healthy
      app-rabbitmq:
        condition: service_healthy

  cargo-service:
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--timeout=4", "--output-document=/dev/null", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
    build:
      context: .
      dockerfile: cargo-service/Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://app-postgres:5432/cargo
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/air-freight
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/air-freight/protocol/openid-connect/certs
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_RABBITMQ_HOST: app-rabbitmq
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
      FLIGHT_API_URL: http://flight-service:8080
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_FLIGHT_TOKENURI: http://keycloak:8080/realms/air-freight/protocol/openid-connect/token
    depends_on:
      keycloak:
        condition: service_healthy
      app-postgres:
        condition: service_healthy
      app-rabbitmq:
        condition: service_healthy
      flight-service:
        condition: service_healthy

  partner-communication-service:
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--timeout=4", "--output-document=/dev/null", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
    build:
      context: .
      dockerfile: partner-communication-service/Dockerfile
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://app-postgres:5432/partner_communication
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_RABBITMQ_HOST: app-rabbitmq
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
    depends_on:
      app-postgres:
        condition: service_healthy
      app-rabbitmq:
        condition: service_healthy

  app-postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5443:5432"
    volumes:
      - ./infrastructure/postgresql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  app-rabbitmq:
    image: rabbitmq:4.3.6-management
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak:
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; grep -q ' 200 ' <&3"
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 12
    image: quay.io/keycloak/keycloak:26.7.4
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_DB: dev-file
      KC_HOSTNAME: http://localhost:8180
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    command: start-dev --import-realm
    volumes:
      - ./infrastructure/keycloak/air-freight-realm.json:/opt/keycloak/data/import/air-freight-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - "127.0.0.1:8180:8080"

volumes:
  postgres-data:
  rabbitmq-data:
  keycloak-data:
