name: air-freight-operations

services:
  flight-service:
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--timeout=4", "--output-document=/dev/null", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
    build:
      context: .
      dockerfile: flight/flight-service/Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8180}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-air-freight}
        VITE_KEYCLOAK_CLIENT_ID: ${FLIGHT_FRONTEND_CLIENT_ID:-flight-frontend}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://app-postgres:5432/flight
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/air-freight
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/air-freight/protocol/openid-connect/certs
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_RABBITMQ_HOST: app-rabbitmq
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
    depends_on:
      keycloak:
        condition: service_healthy
      app-postgres:
        condition: service_healthy
      app-rabbitmq:
        condition: service_healthy

  cargo-service:
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--timeout=4", "--output-document=/dev/null", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
    build:
      context: .
      dockerfile: cargo/cargo-service/Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8180}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-air-freight}
        VITE_KEYCLOAK_CLIENT_ID: ${CARGO_FRONTEND_CLIENT_ID:-cargo-frontend}
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://app-postgres:5432/cargo
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/air-freight
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/air-freight/protocol/openid-connect/certs
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_RABBITMQ_HOST: app-rabbitmq
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
      FLIGHT_API_URL: http://flight-service:8080
      # loading window offsets from the shell when set otherwise from application.properties
      CARGO_LOADINGWINDOW_OPENSBEFORESTD:
      CARGO_LOADINGWINDOW_CLOSESBEFOREETD:
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_FLIGHT_TOKENURI: http://keycloak:8080/realms/air-freight/protocol/openid-connect/token
      CARGO_SERVICE_CLIENT_SECRET:
    depends_on:
      keycloak:
        condition: service_healthy
      app-postgres:
        condition: service_healthy
      app-rabbitmq:
        condition: service_healthy
      flight-service:
        condition: service_healthy

  partner-communication-service:
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--timeout=4", "--output-document=/dev/null", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
    build:
      context: .
      dockerfile: partner-communication-service/Dockerfile
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://app-postgres:5432/partner_communication
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_RABBITMQ_HOST: app-rabbitmq
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
    depends_on:
      app-postgres:
        condition: service_healthy
      app-rabbitmq:
        condition: service_healthy

  app-postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5443:5432"
    volumes:
      - ./infrastructure/postgresql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  app-rabbitmq:
    image: rabbitmq:4.3.6-management
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak:
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; grep -q ' 200 ' <&3"
      interval: 5s
      timeout: 5s
      start_period: 180s
      retries: 12
    image: quay.io/keycloak/keycloak:26.7.4
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_DB: mysql
      KC_DB_URL_HOST: keycloak-mysql
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_HOSTNAME: http://localhost:8180
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    command: start-dev
    ports:
      - "127.0.0.1:8180:8080"
    depends_on:
      keycloak-mysql:
        condition: service_healthy
    networks:
      - default
      - keycloak

  keycloak-mysql:
    restart: unless-stopped
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: password
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - keycloak-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "--protocol=TCP", "-h", "127.0.0.1", "-u", "keycloak", "-ppassword", "--database=keycloak", "--execute=SELECT 1"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
    networks:
      - keycloak

volumes:
  postgres-data:
  rabbitmq-data:
  keycloak-mysql-data:

networks:
  keycloak:
