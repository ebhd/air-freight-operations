import com.github.gradle.node.npm.task.NpxTask
import com.github.gradle.node.npm.task.NpmTask

plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'com.github.node-gradle.node'
}

java { toolchain { languageVersion = JavaLanguageVersion.of(22) } }

dependencies {
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    runtimeOnly 'org.postgresql:postgresql'

    // database tests against a real postgresql in docker, versions from the spring boot bom
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}

// gradle downloads this node version so the build needs no node installation
node {
    download = true
    version = '24.22.1'
    npmInstallCommand = 'ci'
}

tasks.register('buildFrontend', NpmTask) {
    dependsOn tasks.named('npmInstall')
    args = ['run', 'build']
    inputs.dir('src/main/typescript')
    inputs.files('tsconfig.json', 'vite.config.ts', 'package.json', 'package-lock.json')
    inputs.files(fileTree(projectDir) { include '.env*' })
    ['VITE_KEYCLOAK_URL', 'VITE_KEYCLOAK_REALM', 'VITE_KEYCLOAK_CLIENT_ID'].each { setting ->
        inputs.property(setting, providers.environmentVariable(setting).orElse(''))
    }
    outputs.dir('build/generated/javascript')
}

// tailwind keeps only the classes it finds in the html pages and the typescript
tasks.register('compileTailwindCss', NpxTask) {
    dependsOn tasks.named('npmInstall')
    command = 'tailwindcss'
    args = ['--input', 'src/main/css/app.css', '--output', 'build/generated/tailwind/app.css', '--minify']
    inputs.files('src/main/css/app.css', 'package-lock.json')
    inputs.files(fileTree('src/main/resources/static') { include '*.html' })
    inputs.dir('src/main/typescript')
    outputs.file('build/generated/tailwind/app.css')
}

tasks.named('processResources') {
    doFirst { delete layout.buildDirectory.dir('resources/main/static/js') }
    from(tasks.named('buildFrontend')) { into 'static/js' }
    from(tasks.named('compileTailwindCss')) { into 'static/css' }
}

apply from: rootProject.file('gradle/quality.gradle')
