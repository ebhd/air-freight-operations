<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flights to load - Cargo Loading</title>
    <link rel="stylesheet" href="css/app.css">
    <script type="module" src="js/flights-to-load.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
<header class="flex flex-wrap items-center gap-x-6 gap-y-2 bg-blue-950 px-8 py-4 text-white">
    <h1 class="text-2xl font-semibold">Flights to load</h1>
    <p class="flex-1">Date: scheduled departure date (UTC). Times: Brussels time (Europe/Brussels).</p>
    <button id="sign-out" class="cursor-pointer rounded border border-white/60 px-3 py-1 hover:bg-white/10" type="button" hidden>Sign out</button>
</header>
<main class="px-8 py-4">
    <div id="error" class="error mb-4" role="alert" hidden></div>

    <form id="sign-in" class="grid max-w-xs gap-3" hidden>
        <h2 class="text-xl font-semibold">Sign in</h2>
        <p>Development sign-in until the Keycloak login page is built (#1).</p>
        <label class="grid gap-1">Username <input class="rounded border border-slate-400 bg-white px-2 py-1" name="username" autocomplete="username" required></label>
        <label class="grid gap-1">Password <input class="rounded border border-slate-400 bg-white px-2 py-1" name="password" type="password" autocomplete="current-password" required></label>
        <p id="sign-in-error" class="error" role="alert" hidden></p>
        <button class="cursor-pointer rounded bg-blue-900 px-3 py-2 font-medium text-white hover:bg-blue-800" type="submit">Sign in</button>
    </form>

    <section id="content" hidden>
        <p>Signed in.</p>
    </section>
</main>
</body>
</html>
