workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages: [format, lint, build, test]

simulator-build:
  stage: build
  script:
    - ./gradlew :simulator:spotlessCheck :simulator:checkstyleMain :simulator:checkstyleTest :simulator:bootJar :simulator:test :simulator:jacocoTestReport --console=plain
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: simulator/build/test-results/test/TEST-*.xml
    paths:
      - simulator/build/libs/*.jar
      - simulator/build/reports/tests/
      - simulator/build/reports/jacoco/

default:
  image: eclipse-temurin:22-jdk
  interruptible: true
  before_script:
    - chmod +x gradlew
  cache:
    key:
      files:
        - gradle/wrapper/gradle-wrapper.properties
        - build.gradle
      prefix: gradle
    paths:
      - .gradle/wrapper/
      - .gradle/caches/

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

.microservices:
  parallel:
    matrix:
      - SERVICE: flight:flight-service
        SERVICE_DIR: flight/flight-service
      - SERVICE: cargo:cargo-service
        SERVICE_DIR: cargo/cargo-service
      - SERVICE: partner-communication-service
        SERVICE_DIR: partner-communication-service

format:
  extends: .microservices
  stage: format
  script:
    - ./gradlew ":$SERVICE:spotlessCheck" --console=plain

lint:
  extends: .microservices
  stage: lint
  script:
    - ./gradlew ":$SERVICE:checkstyleMain" ":$SERVICE:checkstyleTest" --console=plain
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - $SERVICE_DIR/build/reports/checkstyle/

build:
  extends: .microservices
  stage: build
  script:
    - ./gradlew ":$SERVICE:assemble" --console=plain
  artifacts:
    expire_in: 1 week
    paths:
      - $SERVICE_DIR/build/libs/*.jar

test:
  extends: .microservices
  stage: test
  dependencies: []
  script:
    - ./gradlew ":$SERVICE:test" ":$SERVICE:jacocoTestReport" --console=plain
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: $SERVICE_DIR/build/test-results/test/TEST-*.xml
    paths:
      - $SERVICE_DIR/build/reports/tests/
      - $SERVICE_DIR/build/reports/jacoco/
